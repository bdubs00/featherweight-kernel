# Prometheus configuration for fw. README.md in this directory explains it.
#
# fw serves its metrics at /metrics on the same port as its API. The key
# telemetry.metrics, or the variable FW_TELEMETRY_METRICS, moves the path.
# The route has no authentication, so keep it inside the monitoring
# perimeter: the public gateway must not route /metrics.
#
# Prometheus is not the billing record. Exact usage is in the ledger of
# each fw process.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # Static targets: fw processes that are always on, as host:port.
  # Replace the placeholder. Do not list an ax Task here, and do not scrape
  # one through the atenet router: the router wakes a Task that sleeps, so a
  # scrape every 30 seconds keeps every Task awake. A Task pushes to the
  # collector of otel-collector.yaml instead, and Prometheus scrapes that.
  - job_name: fw
    metrics_path: /metrics
    static_configs:
      - targets:
          - "fw.example.internal:8080" # replace with the address of your fw process

  # Kubernetes pods that opt in with the label fw.dev/scrape=true. The
  # selector asks the API server for these pods only. ax Tasks never carry
  # the label, so Prometheus never scrapes an actor that sleeps.
  #
  # To opt in, add the label to the pod template, name the container port
  # of fw "http", and optionally set the annotation fw.dev/metrics-path
  # when telemetry.metrics is not /metrics.
  - job_name: fw-pods
    kubernetes_sd_configs:
      - role: pod
        selectors:
          - role: pod
            label: "fw.dev/scrape=true"
    relabel_configs:
      # Keep the opt-in check here too, in case the selector is removed.
      - source_labels: [__meta_kubernetes_pod_label_fw_dev_scrape]
        regex: "true"
        action: keep
      # A pod that is not running has nothing to serve.
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      # One target per pod: the container port named http.
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_fw_dev_metrics_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
