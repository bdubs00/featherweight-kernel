# Prometheus alert rules for fw. README.md in this directory explains them.
#
# The thresholds are starting points. Change them to fit your agents.

groups:
  - name: fw-task-quality
    rules:
      - alert: FwVerifiedCompletionRateLow
        expr: |
          ((sum(increase(fw_task_verifications_total{result="satisfied"}[6h])) or vector(0))
            / sum(increase(fw_task_completions_total[6h]))) < 0.8
          and sum(increase(fw_task_completions_total[6h])) >= 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "External verification throughput is below 80% of completions"
          description: "Enable this policy only for integrations expected to report verification. Missing receipts are unverified, not failures; delayed receipts cross windows. Model grader judgments do not count. Use the ledger for a cohort SLO."
      - alert: FwOperatorInterventionsHigh
        expr: |
          sum(rate(fw_operator_interventions_per_run_sum{coverage="complete"}[1h]))
            / sum(rate(fw_operator_interventions_per_run_count{coverage="complete"}[1h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than three operator actions per completion episode"
          description: "Concrete ledger decisions, interactive followups and attributed budget changes increased. Zero-action episodes are in the denominator."
      - alert: FwRecoverySlow
        expr: histogram_quantile(0.95, sum by (le, result) (rate(fw_recovery_duration_seconds_bucket[1h]))) > 120
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Recovery p95 is above two minutes ({{ $labels.result }})"
          description: "Measured from resume, not suspend. Failed, canceled and interrupted attempts are distinct from first progress."
      - alert: FwConfirmedDuplicateEffects
        expr: sum(increase(fw_confirmed_duplicate_effects_total[1h])) > 0
        labels:
          severity: critical
        annotations:
          summary: "An integration confirmed duplicate external effects"
          description: "Inspect fw.quality.observation spans and fw.run.annotated quality receipts. Tool retries alone never trigger this count."
      - alert: FwSuccessfulTaskCostUnknown
        expr: sum by (reason) (increase(fw_successful_task_cost_excluded_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Successful task cost excluded ({{ $labels.reason }})"
          description: "Some accepted or externally satisfied episodes cannot enter the cost histogram. Configure missing prices or repair missing usage. Unknown cost is not zero."
      - alert: FwSuccessfulTaskCostHigh
        expr: |
          sum(rate(fw_successful_task_cost_usd_sum[6h])) / sum(rate(fw_successful_task_cost_usd_count[6h])) > 5
          and sum(increase(fw_successful_task_cost_usd_count[6h])) >= 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Mean own cost per price-complete successful episode exceeds $5"
          description: "This is per-run episode model cost, not tree cost. Children and grader runs are not charged again to their parent. Compare the excluded-cost panel before interpreting the mean."
  - name: fw
    rules:
      - alert: FwTargetDown
        expr: up{job=~"fw|fw-pods"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape fw at {{ $labels.instance }}"
          description: "The scrape of {{ $labels.instance }} failed for 5 minutes. The process is down, or the network blocks the scrape."

      - alert: FwApprovalWaiting
        expr: time() - min by (agent) (fw_approvals_oldest_timestamp_seconds) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An approval of agent {{ $labels.agent }} waits for more than 1 hour"
          description: "The oldest approval waited {{ $value | humanizeDuration }}. The run does nothing until a person allows or denies the action. Open the dashboard to decide."

      - alert: FwRunFailuresRising
        expr: |
          (
            sum by (agent) (increase(fw_runs_total{outcome="failed"}[30m]))
              / sum by (agent) (increase(fw_runs_total[30m]))
          ) > 0.25
          and sum by (agent) (increase(fw_runs_total{outcome="failed"}[30m])) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 25% of the runs of agent {{ $labels.agent }} failed in 30 minutes"
          description: "{{ $value | humanizePercentage }} of the finished runs failed. Read the error of a failed run in the dashboard or with fw events."

      - alert: FwBudgetStops
        expr: sum by (agent, limit) (increase(fw_budget_exceeded_total{limit!="maxRepeats"}[1h])) > 0
        labels:
          severity: info
        annotations:
          summary: "The budget limit {{ $labels.limit }} stopped runs of agent {{ $labels.agent }}"
          description: "{{ $value | humanize }} runs stopped at the limit in the last hour. Raise the limit in the profile if the work needs more, or narrow the task."

      - alert: FwLoops
        expr: sum by (agent) (increase(fw_loops_total{action="failed"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "The loop guard stopped runs of agent {{ $labels.agent }}"
          description: "In the last hour, {{ $value | humanize }} runs ended because the model made the same tool call again and again. Read the run to see which call repeated."

      - alert: FwMCPServerDown
        expr: max by (server) (fw_mcp_server_up) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The MCP server {{ $labels.server }} does not answer"
          description: "fw marked the server down after failed requests. The tools of the server fail until it answers again."

      - alert: FwModelErrorRate
        expr: |
          (
            sum by (provider, model) (rate(fw_model_requests_total{outcome="error"}[10m]))
              / sum by (provider, model) (rate(fw_model_requests_total[10m]))
          ) > 0.1
          and sum by (provider, model) (increase(fw_model_requests_total{outcome="error"}[10m])) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of the calls to {{ $labels.provider }}/{{ $labels.model }} fail"
          description: "{{ $value | humanizePercentage }} of the model calls failed in 10 minutes. Look for a provider outage, a rate limit, or a credential that expired."

      - alert: FwModelLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (provider, model, le) (rate(fw_model_request_duration_seconds_bucket[15m]))
          ) > 120
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The p95 latency of {{ $labels.provider }}/{{ $labels.model }} is over 2 minutes"
          description: "The p95 latency is {{ $value | humanizeDuration }}. A large model with a high effort can be slow. Raise the threshold for such a model."
